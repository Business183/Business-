<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Cuts | Modern Haircuts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Section 1: Info / Hero -->
    <section class="info-section">
        <div class="info-container">
            <header>
                <div class="logo">MKM<b>.</b></div>
            </header>
            <main class="hero-content">
                <h1>BOOK THROUGH SENDING MESSAGE to <a href="tel:+12136442350">213-644-2350</a> </h1>
                <h2>available only weekends (sunday and saturday) 9AM-5PM -35$ any haircut- only in home haircuts</h2>
                <a href="#gallery" class="cta-btn">View Gallery ↓</a>
            </main>
        </div>
    </section>

    <!-- Section 2: Display Grid -->
    <section id="gallery" class="gallery-section">
        <div class="gallery-header">
            <h2>Featured Styles</h2>
            <p>Hover over each style to experience the contrast.</p>
        </div>
        
        <div class="gallery-grid">
            <!-- Card 1 -->
            <div class="card">
                <img src="mm.png" alt="Classic Fade Haircut">
                <div class="card-overlay">
                    <h3>01 / The Modern Mullet</h3>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <img src="taper.png" alt="Textured Crop Haircut">
                <div class="card-overlay">
                    <h3>02 / taper cut</h3>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <img src="buzz.png" alt="Sharp Buzz Cut">
                <div class="card-overlay">
                    <h3>03 / Sharp Buzz</h3>
                </div>
            </div>

            <!-- Card 4 -->
            <div class="card">
                <img src="fades.png" alt="Modern Pompadour">
                <div class="card-overlay">
                    <h3>04 / fades</h3>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
